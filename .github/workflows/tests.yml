name: Tests

# Runs the test suite on every push to main and every pull request,
# but only when code, tests or packaging change (README edits skip it).
# Free and unlimited for public repositories.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      # let every Python version finish even if one fails
      fail-fast: false
      matrix:
        # oldest and newest that GitHub's runners still provide
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install . pytest

      - name: Run tests
        run: python -m pytest -v
