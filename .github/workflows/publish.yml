name: Publish to PyPI

# Push a tag like v0.2.2 and this builds the package and uploads it to PyPI.
# Uses PyPI trusted publishing, so no API token is stored in GitHub.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pyproject=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          init=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/roku_smarthome/__init__.py').read()).group(1))")
          echo "tag=$tag pyproject=$pyproject __init__=$init"
          if [ "$tag" != "$pyproject" ] || [ "$tag" != "$init" ]; then
            echo "::error::Tag v$tag does not match pyproject.toml ($pyproject) and __init__.py ($init)"
            exit 1
          fi

      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Smoke test the wheel
        run: |
          python -m pip install dist/*.whl
          cd /tmp
          python -c "from roku_smarthome import *; import roku_smarthome; print(roku_smarthome.__version__)"
          roku-smarthome --help

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
